# CI do Sereno (Area 4): a cada push ou pull request, compila e testa todas as areas,
# monta a imagem Docker da API, sobe o docker-compose e confere a saude da API.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API Java (build e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: area3-mvp/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compilar e rodar os testes (JUnit)
        run: ./mvnw -B test
      - name: Resumo dos casos de teste
        if: always()
        working-directory: .
        run: python3 area4-devops/resumo_testes.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Guardar os relatorios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-api
          path: area3-mvp/api/target/surefire-reports/

  app:
    name: App Expo (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: area3-mvp/app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: area3-mvp/app/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Conferir os tipos (TypeScript)
        run: npx tsc --noEmit

  python:
    name: Python (simulador e pipeline de dados)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: area2-dados/requirements.txt
      - name: Conferir a sintaxe dos scripts
        run: python -m py_compile area3-mvp/iot/simulador.py area4-devops/resumo_testes.py area2-dados/*.py
      - name: Instalar o pandas
        run: pip install -r area2-dados/requirements.txt
      - name: Testes do pipeline (unittest)
        working-directory: area2-dados
        run: python -m unittest discover -s testes -v
      - name: Rodar o pipeline como o README manda (sem internet, clima de amostra/)
        working-directory: area2-dados
        run: |
          python pipeline.py --offline | tee saida.txt
          test -s powerbi/fato_diario_canteiro.csv
          {
            echo "### Pipeline de dados (bronze, prata e ouro)"
            echo '```'
            cat saida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker (imagem, compose e saude)
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v5
      - name: Segredos do ensaio (gerados na hora, nunca gravados no repositorio)
        run: |
          echo "DB_SENHA=$(openssl rand -hex 16)" > .env
          echo "JWT_SEGREDO=$(openssl rand -hex 32)" >> .env
      - name: Montar a imagem da API
        run: docker compose build api
      - name: Subir o banco e a API
        run: docker compose up -d
      - name: Esperar a API ficar saudavel (/actuator/health)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"UP"'; then
              echo "API saudavel depois de $((i * 2)) s"; exit 0
            fi
            sleep 2
          done
          echo "A API nao ficou saudavel em 120 s"; exit 1
      - name: Teste de fumaca no PostgreSQL (login da tecnica e exportacao)
        run: |
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ana@exemplo.com","senha":"horta2026"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          N=$(curl -fsS http://localhost:8080/api/dados/canteiros -H "Authorization: Bearer $TOKEN" \
            | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          SEM=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/canteiros)
          {
            echo "### Docker compose"
            echo ""
            echo "| Conferencia | Resultado |"
            echo "|---|---|"
            echo "| /actuator/health | $(curl -fsS http://localhost:8080/actuator/health) |"
            echo "| login da tecnica no PostgreSQL | token recebido |"
            echo "| canteiros exportados | $N |"
            echo "| rota protegida sem token | HTTP $SEM |"
            echo ""
            echo '```'
            docker compose ps
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$N" -ge 3 && test "$SEM" = "401"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: area2-dados/requirements.txt
      - name: Instalar o pandas
        run: pip install -r area2-dados/requirements.txt
      - name: Fluxo ponta a ponta (sensor, API, alerta, fiz e pipeline)
        run: |
          ./area4-devops/fluxo_ponta_a_ponta.sh | tee fluxo.txt
          {
            echo "### Fluxo ponta a ponta contra a API no Docker"
            echo '```'
            cat fluxo.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Logs da API (se algo falhar)
        if: failure()
        run: docker compose logs api
      - name: Derrubar o ambiente
        if: always()
        run: docker compose down -v
