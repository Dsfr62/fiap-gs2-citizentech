spring.application.name=gs2-api
# Mensagens de validacao em portugues
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
server.port=${PORT:8080}

# Banco: H2 em memoria por padrao (roda sem instalar nada).
# No Docker, as variaveis DB_URL, DB_USUARIO e DB_SENHA apontam para o PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:gs2;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USUARIO:sa}
spring.datasource.password=${DB_SENHA:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Seguranca. Em qualquer ambiente que nao seja a maquina local, definir JWT_SEGREDO.
seguranca.jwt.segredo=${JWT_SEGREDO:segredo-so-para-rodar-local-troque-em-producao}
seguranca.jwt.validade-horas=8
cors.origens=${CORS_ORIGENS:http://localhost:8081,http://localhost:19006,http://127.0.0.1:8081}

# Servico de IA da Area 1. Vazio = usa so a regra basica.
ia.url=${IA_URL:http://localhost:8001}

# Senha dos usuarios de demonstracao (so dados de exemplo).
demo.senha=${DEMO_SENHA:horta2026}

# Monitoramento (Area 4): /actuator/health aberto; o resto exige login.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.nome=GS2 CitizenTech API
info.app.versao=0.1.0

springdoc.swagger-ui.path=/swagger-ui.html
